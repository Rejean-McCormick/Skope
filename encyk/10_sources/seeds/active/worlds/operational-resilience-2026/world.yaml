  - smart_vote
  - konservation
canon:
  organizations: canon/organizations.json
  actors: canon/actors.json
  capabilities: canon/capabilities.json
  operational_areas: canon/operational-areas.json
  incidents: canon/incidents.json
  bindings: canon/bindings.json
operational_scenarios:
- operational/wildfire-offline.json
- operational/bridge-medical-logistics.json
- operational/cyber-fragmented-picture.json
module_seeds:
  knowledge: modules/knowledge/seed.json
  konstruct: modules/konstruct/seed.json
  stockage: modules/stockage/seed.json
  ekoh: scenarios/operational-resilience-after-action.json
  kontact: modules/kontact/seed.json
