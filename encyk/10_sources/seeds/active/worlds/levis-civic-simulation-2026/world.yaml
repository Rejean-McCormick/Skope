  certifikation: modules/certifikation.json
  smart_vote: modules/smart-vote.json
  konstruct: modules/konstruct.json
  stockage: modules/stockage.json
  kontact: modules/kontact.json
  konservation: modules/konservation.json
  crosslinks: modules/crosslinks.json
