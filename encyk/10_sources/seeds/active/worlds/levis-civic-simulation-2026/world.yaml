world_contract: kx-world-pack/v1
world_key: levis-civic-simulation-2026
title: Lévis 2026 — simulation civique intégrée
description: 'Monde civique municipal sourcé structuré en trois arcs: croissance/capacité,
  mobilité et territoire/mandat citoyen. Les positions réelles demeurent des reconstructions
  sourcées; les experts, projets, impacts et parcours ajoutés en v0.2 sont explicitement
  simulés.'
pack_version: 0.2.1
requires:
  ethikos_scenario_schema: ethikos-demo-scenario/v3
  fixtures:
  - isced-f
scenarios:
- scenarios/levis-civic-simulation-2026.json
persona_policy:
  real_person_representation: reconstructed_position
  unknown_position: omit
  historical_positions_are_time_scoped: true
  simulated_experts: explicitly_labeled
derived_data:
  smart_vote:
    build_readings: false
    baseline_always_visible: true
  search:
    build_index: true
module_sidecars:
