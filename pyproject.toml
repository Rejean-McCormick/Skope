[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skope-local-wikidata"
version = "1.0.0rc1"
description = "Standalone offline-first Wikidata scope and evidence explorer"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
fast = ["indexed-bzip2>=1.7.0"]
test = ["pytest>=8"]

[project.scripts]
skope = "skope.cli:main"

[tool.setuptools.packages.find]
include = ["skope*"]

[tool.setuptools.package-data]
skope = ["static/*"]
